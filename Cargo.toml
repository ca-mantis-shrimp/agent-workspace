[package]
name = "agent-workspace"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A durable, harness-neutral workspace substrate for coding agents"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.21"
