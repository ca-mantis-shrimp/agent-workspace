# Pin the exact toolchain so every environment formats and lints identically.
#
# rustfmt's canonical output is version-dependent, and that skew is the root
# cause behind two things this repo already works around: the formatter-noise
# commits the pre-commit gate catches (.githooks/pre-commit) and the potential
# cross-environment false stales in rustfmt-normalized fingerprints
# (docs/implementation-notes.md, "Normalized fingerprinting"). Pinning an exact
# version — not the floating "stable" channel — is what actually closes it.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
